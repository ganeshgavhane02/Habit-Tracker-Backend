<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Habit Tracker - Elite Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border-color: #e5e7eb;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-primary: #1f2937;
            --bg-secondary: #111827;
            --bg-tertiary: #374151;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --text-tertiary: #9ca3af;
            --border-color: #374151;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        }

        body.scroll-locked {
            overflow: hidden;
        }

        /* ===== HERO SECTION ===== */
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(14, 165, 233, 0.05) 100%);
        }

        .hero-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(14, 165, 233, 0.1) 0%, transparent 50%);
            z-index: 0;
            animation: backgroundShift 8s ease-in-out infinite;
        }

        @keyframes backgroundShift {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, 20px);
            }
        }

        .hero-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-title {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            margin-bottom: 20px;
            color: #6366f1;
            background: linear-gradient(135deg, #6366f1 0%, #0ea5e9 50%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            animation: fadeInUp 1s ease-out 0.5s both;
            display: inline-block;
            width: 100%;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-weight: 300;
            animation: fadeInUp 1s ease-out 0.7s both;
        }

        .hero-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 40px;
            line-height: 1.6;
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        /* ===== SCROLL LOCK BUTTON ===== */
        .scroll-lock-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            animation: slideUp 0.8s ease-out 1.1s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .scroll-lock-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-primary);
            transition: all 0.3s ease;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
        }

        .scroll-lock-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: var(--primary);
        }

        .scroll-lock-btn.locked {
            background: linear-gradient(135deg, var(--primary) 0%, var(--info) 100%);
            color: white;
            border-color: transparent;
        }

        .scroll-lock-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            animation: pulse 2s ease-in-out infinite;
        }

        .scroll-lock-btn.locked .scroll-lock-indicator {
            background: var(--success);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        /* ===== HABIT SHOWCASE CAROUSEL ===== */
        .showcase-section {
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, transparent 0%, rgba(99, 102, 241, 0.05) 100%);
        }

        .showcase-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 60px;
            text-align: center;
            color: var(--text-primary);
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 500px;
            margin: 0 auto;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .carousel-item {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            border-radius: 20px;
            border: 2px solid var(--border-color);
            padding: 40px;
            box-shadow: var(--shadow-lg);
            transform: translateX(100%) rotateY(45deg) scale(0.8);
        }

        .carousel-item.active {
            opacity: 1;
            transform: translateX(0) rotateY(0deg) scale(1);
            z-index: 10;
            pointer-events: auto;
        }

        .carousel-item.prev {
            opacity: 0.4;
            transform: translateX(-100%) rotateY(-45deg) scale(0.8);
            z-index: 5;
        }

        .carousel-item.next {
            opacity: 0.4;
            transform: translateX(100%) rotateY(45deg) scale(0.8);
            z-index: 5;
        }

        .item-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .item-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: block;
        }

        .item-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
            display: block;
        }

        .item-stat {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 20px;
            display: block;
        }

        /* ===== CAROUSEL CONTROLS ===== */
        .carousel-controls {
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .carousel-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }

        .carousel-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-3px);
        }

        .carousel-dots {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--primary);
            width: 30px;
            border-radius: 6px;
        }

        /* ===== STATS SECTION ===== */
        .stats-section {
            min-height: 100vh;
            padding: 60px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .stat-card {
            background: var(--bg-primary);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out backwards;
        }

        .stat-card:nth-child(1) {
            animation-delay: 0s;
        }

        .stat-card:nth-child(2) {
            animation-delay: 0.1s;
        }

        .stat-card:nth-child(3) {
            animation-delay: 0.2s;
        }

        .stat-card:nth-child(4) {
            animation-delay: 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ===== SMOOTH SCROLL ===== */
        .scroll-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            animation: bounce 2s infinite;
        }

        .scroll-indicator-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .scroll-indicator-arrow {
            font-size: 1.5rem;
            animation: slideDown 1s ease-in-out infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-10px);
            }
        }

        @keyframes slideDown {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateY(10px);
                opacity: 0;
            }
        }

        /* ===== DARK MODE TOGGLE ===== */
        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 1000;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }

        .dark-mode-toggle:hover {
            transform: scale(1.1);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }

            .showcase-title {
                font-size: 2rem;
            }

            .carousel-item {
                padding: 25px;
            }

            .item-title {
                font-size: 1.5rem;
            }

            .carousel-container {
                height: 350px;
            }

            .scroll-lock-container {
                bottom: 100px;
            }
        }
    </style>
</head>

<body>
    <!-- Dark Mode Toggle -->
    <button class="dark-mode-toggle" id="darkModeToggle">🌙</button>

    <!-- HERO SECTION -->
    <section class="hero-container">
        <div class="hero-background"></div>
        <div class="hero-content">
            <h1 class="hero-title">Mastery Starts Now</h1>
            <p class="hero-subtitle">2025 ELITE HABIT TRACKER</p>
            <p class="hero-description">
                Build unstoppable momentum. Track every victory. Celebrate consistency.
                Your excellence journey begins here.
            </p>
        </div>

        <!-- Scroll Lock Button -->
        <div class="scroll-lock-container">
            <button class="scroll-lock-btn" id="scrollLockBtn">
                <span class="scroll-lock-indicator"></span>
                <span id="scrollLockText">TAP TO LOCK • SCROLL TO EXPLORE</span>
            </button>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator" id="scrollIndicator">
            <span class="scroll-indicator-text">SCROLL DOWN</span>
            <span class="scroll-indicator-arrow">↓</span>
        </div>
    </section>

    <!-- SHOWCASE SECTION -->
    <section class="showcase-section">
        <h2 class="showcase-title">Your Habit Achievements</h2>

        <div class="carousel-container">
            <div class="carousel" id="carousel">
                <!-- Items will be generated by JavaScript -->
            </div>

            <div class="carousel-controls">
                <button class="carousel-btn" id="prevBtn">←</button>
                <button class="carousel-btn" id="nextBtn">→</button>
            </div>

            <div class="carousel-dots" id="dots">
                <!-- Dots will be generated by JavaScript -->
            </div>
        </div>
    </section>

    <!-- STATS SECTION -->
    <section class="stats-section" id="statsSection">
        <!-- Stats will be generated by JavaScript -->
    </section>

    <!-- Main Script -->
    <script>
        // ===== Wait for DOM =====
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initDashboard);
        } else {
            initDashboard();
        }

        function initDashboard() {
            console.log('🚀 Initializing Elite Habit Tracker Dashboard...');

            // ===== GSAP Animation Setup =====
            gsap.registerPlugin(ScrollTrigger);

            // ===== Dark Mode =====
            const darkModeToggle = document.getElementById('darkModeToggle');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (localStorage.getItem('darkMode') === 'true' || (prefersDark && !localStorage.getItem('darkMode'))) {
                document.body.classList.add('dark-mode');
                darkModeToggle.textContent = '☀️';
            }

            darkModeToggle.addEventListener('click', () => {
                document.body.classList.toggle('dark-mode');
                const isDark = document.body.classList.contains('dark-mode');
                localStorage.setItem('darkMode', isDark);
                darkModeToggle.textContent = isDark ? '☀️' : '🌙';
                console.log('🌓 Dark mode toggled:', isDark);
            });

            // ===== SCROLL LOCK =====
            const scrollLockBtn = document.getElementById('scrollLockBtn');
            const scrollLockText = document.getElementById('scrollLockText');
            const scrollIndicator = document.getElementById('scrollIndicator');
            let isLocked = false;

            scrollLockBtn.addEventListener('click', () => {
                isLocked = !isLocked;
                document.body.classList.toggle('scroll-locked');
                scrollLockBtn.classList.toggle('locked');

                if (isLocked) {
                    scrollLockText.textContent = '🔒 SCROLL LOCKED';
                    scrollIndicator.style.opacity = '0';
                    scrollIndicator.style.pointerEvents = 'none';
                    console.log('🔒 Scroll locked');
                } else {
                    scrollLockText.textContent = 'TAP TO LOCK • SCROLL TO EXPLORE';
                    scrollIndicator.style.opacity = '1';
                    scrollIndicator.style.pointerEvents = 'auto';
                    console.log('🔓 Scroll unlocked');
                }
            });

            // Prevent scroll when locked
            window.addEventListener('wheel', (e) => {
                if (isLocked && window.scrollY < window.innerHeight) {
                    e.preventDefault();
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (isLocked && window.scrollY < window.innerHeight) {
                    e.preventDefault();
                }
            }, { passive: false });

            // ===== CAROUSEL DATA =====
            const carouselData = [
                {
                    icon: '🌅',
                    title: 'Morning Routine',
                    description: 'Start your day with intention and energy',
                    stat: '28 Day Streak'
                },
                {
                    icon: '💪',
                    title: 'Fitness Goals',
                    description: 'Build strength and endurance consistently',
                    stat: '45 Days Strong'
                },
                {
                    icon: '📚',
                    title: 'Learning Path',
                    description: 'Expand your knowledge every single day',
                    stat: '92% Completion'
                },
                {
                    icon: '😴',
                    title: 'Sleep Quality',
                    description: 'Prioritize rest for optimal performance',
                    stat: '7.2 Avg Hours'
                },
                {
                    icon: '🧘',
                    title: 'Mindfulness',
                    description: 'Practice presence and mental clarity',
                    stat: '15 Min Daily'
                }
            ];

            // ===== CAROUSEL SETUP =====
            const carousel = document.getElementById('carousel');
            const dotsContainer = document.getElementById('dots');
            let currentIndex = 0;

            // Generate carousel items
            carouselData.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `carousel-item ${index === 0 ? 'active' : ''}`;
                itemDiv.innerHTML = `
                    <div>
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-title">${item.title}</div>
                        <div class="item-description">${item.description}</div>
                        <div class="item-stat">${item.stat}</div>
                    </div>
                `;
                carousel.appendChild(itemDiv);

                // Generate dots
                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dot.addEventListener('click', () => {
                    goToSlide(index);
                });
                dotsContainer.appendChild(dot);
            });

            console.log('✨ Carousel created with ' + carouselData.length + ' items');

            function goToSlide(index) {
                const items = document.querySelectorAll('.carousel-item');
                const dots = document.querySelectorAll('.dot');

                items.forEach((item, i) => {
                    item.classList.remove('active', 'prev', 'next');
                    if (i === index) {
                        item.classList.add('active');
                    } else if (i < index) {
                        item.classList.add('prev');
                    } else {
                        item.classList.add('next');
                    }
                });

                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });

                currentIndex = index;
            }

            document.getElementById('nextBtn').addEventListener('click', () => {
                const nextIndex = (currentIndex + 1) % carouselData.length;
                goToSlide(nextIndex);
                console.log('→ Next slide:', nextIndex);
            });

            document.getElementById('prevBtn').addEventListener('click', () => {
                const prevIndex = (currentIndex - 1 + carouselData.length) % carouselData.length;
                goToSlide(prevIndex);
                console.log('← Previous slide:', prevIndex);
            });

            // ===== STATS SECTION =====
            const statsData = [
                { icon: '📊', value: '156', label: 'Total Habits Completed' },
                { icon: '🔥', value: '28', label: 'Current Best Streak' },
                { icon: '⭐', value: '94%', label: 'Average Completion Rate' },
                { icon: '📈', value: '45', label: 'Days in Program' }
            ];

            const statsSection = document.getElementById('statsSection');
            statsData.forEach((stat, index) => {
                const card = document.createElement('div');
                card.className = 'stat-card';
                card.innerHTML = `
                    <div class="stat-icon">${stat.icon}</div>
                    <div class="stat-value">${stat.value}</div>
                    <div class="stat-label">${stat.label}</div>
                `;
                statsSection.appendChild(card);
            });

            console.log('📊 Stats section loaded with ' + statsData.length + ' cards');

            // ===== PARALLAX & SCROLL ANIMATIONS =====
            try {
                gsap.to('.hero-background', {
                    scrollTrigger: {
                        trigger: '.hero-container',
                        start: 'top top',
                        end: 'bottom top',
                        scrub: 1,
                        markers: false
                    },
                    y: -200,
                    opacity: 0.5
                });

                gsap.to('.scroll-indicator', {
                    scrollTrigger: {
                        trigger: '.hero-container',
                        start: 'top top',
                        end: 'bottom top',
                        scrub: 1
                    },
                    opacity: 0,
                    y: 50
                });

                gsap.utils.toArray('.stat-card').forEach((card) => {
                    gsap.from(card, {
                        scrollTrigger: {
                            trigger: card,
                            start: 'top 80%',
                            end: 'top 50%',
                            scrub: 1,
                            markers: false
                        },
                        y: 50,
                        opacity: 0,
                        duration: 1
                    });
                });

                console.log('🎬 GSAP animations loaded');
            } catch (e) {
                console.warn('⚠️ GSAP animation error:', e);
            }

            // ===== Auto-carousel rotation =====
            const autoCarousel = setInterval(() => {
                if (!isLocked) {
                    const nextIndex = (currentIndex + 1) % carouselData.length;
                    goToSlide(nextIndex);
                }
            }, 5000);

            // ===== Keyboard navigation =====
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') {
                    const prevIndex = (currentIndex - 1 + carouselData.length) % carouselData.length;
                    goToSlide(prevIndex);
                    console.log('⌨️ Keyboard: Left arrow');
                } else if (e.key === 'ArrowRight') {
                    const nextIndex = (currentIndex + 1) % carouselData.length;
                    goToSlide(nextIndex);
                    console.log('⌨️ Keyboard: Right arrow');
                }
            });

            console.log('✅ Elite Habit Tracker Dashboard fully loaded!');
        }
    </script>
</body>

</html>
